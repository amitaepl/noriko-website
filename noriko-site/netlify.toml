[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  included_files = ["private/ASHOKASHA-HORECA-CATALOG-AUGUST-2026.pdf"]

[[headers]]
  for = "/api/send-catalogue"
  [headers.values]
    Cache-Control = "no-store"
    X-Content-Type-Options = "nosniff"
