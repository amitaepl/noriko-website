[build]
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  included_files = ["private/ASHOKASHA-HORECA-CATALOG-AUGUST-2026.pdf"]

[[headers]]
  for = "/api/send-catalogue"
  [headers.values]
    Cache-Control = "no-store"
    X-Content-Type-Options = "nosniff"

# Let browsers keep images and fonts for a week instead of re-checking on
# every visit. CSS and JS stay revalidated: they are cache-busted with ?v=.
[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/assets/brand/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
